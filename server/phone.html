<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF3DF">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>发到教室</title>
<style>
  /* 和大屏同一套：奶油方格纸、深棕描边、亮黄主色 */
  :root{
    --bg:#FBF3DF; --card:#FFF8E7; --ink:#31231A; --ink2:#6B5545; --ink3:#9B8672;
    --line:#3A2A1E; --line-soft:rgba(58,42,30,.28);
    --yellow:#FFD64F; --green:#7A5A12; --red:#DE3B34; --amber:#996008;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --e:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background-color:var(--bg);color:var(--ink);
    font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background-image:
    linear-gradient(to right,rgba(176,146,84,.13) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(176,146,84,.13) 1px,transparent 1px);
    background-size:26px 26px}
  body{padding:0 18px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}

  header{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .cls{font-size:21px;font-weight:900;letter-spacing:.02em}
  .net{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.02em}
  .net b{color:var(--ink2);font-weight:500}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2FA36B;
    margin-right:5px;vertical-align:1px;animation:breathe 2.6s var(--e) infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  .card{background:var(--card);border:2px solid var(--line);
    border-radius:18px 15px 19px 16px;padding:16px;
    box-shadow:3px 3px 0 rgba(58,42,30,.14)}

  textarea{width:100%;min-height:104px;border:0;outline:0;resize:none;background:transparent;
    /* 这里原来写的是 font:500 20px/1.5 inherit，简写里 family 不能用 inherit，
       整条声明作废，输入框回落到浏览器默认的 13.3px：安卓和鸿蒙上是小字，
       iOS 又会因为小于 16px 自动放大整页。拆成四条各自生效。 */
    font-family:inherit;font-size:20px;font-weight:500;line-height:1.5;
    color:var(--ink);padding:0}
  textarea::placeholder{color:#B3BDB7;font-weight:400}
  .count{font-family:var(--mono);font-size:11.5px;color:var(--ink3);text-align:right;
    margin-top:6px;letter-spacing:.03em}

  .row{display:flex;gap:8px;margin-top:14px}
  .seg{flex:1;border:2px solid var(--line-soft);background:transparent;border-radius:12px;
    padding:11px 8px;font:700 15.5px inherit;color:var(--ink2);cursor:pointer;
    transition:background .22s var(--e),color .22s var(--e),border-color .22s var(--e)}
  .seg.on{background:var(--yellow);border-color:var(--line);color:var(--ink);
    box-shadow:2px 2px 0 rgba(58,42,30,.18)}
  .seg.on.red{background:var(--red);border-color:var(--line);color:#FFF8E7}

  .label{font-size:12px;color:var(--ink3);letter-spacing:.06em;margin:18px 0 8px}

  .row.wrap{flex-wrap:wrap}
  .row.wrap .seg{flex:1 1 44%}

  .custom{display:flex;align-items:center;gap:8px;margin-top:10px;
    font-size:13px;color:var(--ink3)}
  .custom input{width:62px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;
    background:transparent;font:500 14px var(--mono);color:var(--ink);text-align:center;outline:0}
  .custom input:focus{border-color:var(--green)}
  .custom input::-webkit-outer-spin-button,
  .custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* ---------- 安装到主屏幕（PWA，ROADMAP 9.4 P2 B1） ---------- */
  .pwa{display:none;margin:0 0 12px;align-items:center;gap:10px;
    font-size:12.5px;color:var(--ink3)}
  .pwa.show{display:flex}
  .pwa button{padding:7px 12px;border:2px solid var(--line);border-radius:10px;
    background:var(--yellow);font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);
    box-shadow:2px 2px 0 rgba(58,42,30,.18);cursor:pointer}
  .pwa i{font-style:normal}

  /* 改教室设置 */
  .cfgHint{font-size:12.5px;color:var(--ink3);line-height:1.6;margin:4px 0 10px}
  .cfgbtn{width:100%;padding:13px;border:2px solid var(--line);
    border-radius:12px;background:var(--card);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:14.5px;
    box-shadow:2px 2px 0 rgba(58,42,30,.14);cursor:pointer}
  .cfgbtn:active{background:#F3E8D2}
  #cfgEditor{margin-top:14px}
  .cfgText{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;
    background:#FFFDF6;color:var(--ink);font-family:inherit;font-size:16px;
    box-sizing:border-box}
  .cfgText:focus{outline:none;border-color:var(--green)}
  .blk{display:flex;align-items:center;gap:8px;margin:0 0 8px;
    background:#FFFDF6;border:2px solid var(--line);border-radius:10px;padding:8px 10px}
  .blk .bn{flex:1;min-width:0}
  .blk .bn b{display:block;font-size:12px;color:var(--ink3);font-weight:500}
  .blk input{border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:16px;width:100%;padding:2px 0}
  .blk input:focus{outline:none}
  .blk time{font-family:var(--mono);font-size:12px;color:var(--ink3);
    display:flex;flex-direction:column;gap:4px;flex:none}
  /* 时间输入不给固定宽度：安卓/钉钉内置浏览器的 type=time 控件比
     预设宽（2026-11-17 真机：74px 把 08:10 裁成 08:1），改成自适应
     + 最小宽度，值永远完整可见。字号 16px：iOS 对 <16px 的输入框
     聚焦时会把整页放大（与 #text 同一条守则）。 */
  .blk time input{width:auto;min-width:5.6em;font-size:16px;border:1.5px solid var(--line);
    border-radius:7px;padding:4px 5px;background:#FFF;color:var(--ink);text-align:center}
  .per{margin:0 0 10px;border:2px solid var(--line);border-radius:10px;
    background:#FFFDF6;overflow:hidden}
  .per h4{margin:0;padding:7px 10px;font-size:13px;color:var(--ink3);font-weight:600;
    background:#F7EFDC;border-bottom:2px solid var(--line)}
  .per .day{display:flex;align-items:center;gap:8px;padding:6px 10px}
  .per .day + .day{border-top:1px dashed #E5D9BE}
  .per .day b{flex:none;width:34px;font-size:13px;color:var(--ink3);font-weight:500}
  .per .day input{flex:1;min-width:0;border:none;background:transparent;
    color:var(--ink);font-family:inherit;font-size:16px;padding:3px 0}
  .per .day input:focus{outline:none}
  .per .day input + input{border-left:1.5px solid var(--line);padding-left:8px}

  /* 提醒文字 / 话术 */
  .txtRow{display:flex;align-items:center;gap:8px;margin:0 0 8px;
    background:#FFFDF6;border:2px solid var(--line);border-radius:10px;padding:7px 10px}
  .txtRow b{flex:none;max-width:88px;font-size:12px;color:var(--ink3);
    font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .txtRow input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:16px;padding:2px 0}
  .txtRow input:focus{outline:none}
  .phRow{display:flex;align-items:center;gap:8px;margin:0 0 8px;
    background:#FFFDF6;border:2px solid var(--line);border-radius:10px;padding:6px 8px 6px 10px}
  .phRow input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
    font-family:inherit;font-size:16px;padding:3px 0}
  .phRow input:focus{outline:none}
  .phRow h4{display:flex;align-items:center;gap:8px}
  h4 .del{margin-left:auto}
  .del{flex:none;border:2px solid var(--line);background:var(--card);color:#B02A22;
    border-radius:8px;padding:5px 10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .cfgMini{margin:0 0 14px;padding:10px;background:#FFFDF6;box-shadow:none;font-weight:600}

  /* 现在屏上是什么 */
  .live{display:none;margin-bottom:14px;padding:13px 15px;border-radius:16px 13px 15px 12px;
    background:var(--yellow);border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(58,42,30,.16);align-items:center;gap:12px}
  .live.show{display:flex;animation:pop .3s var(--e)}
  .live .lv{flex:1;min-width:0}
  .live .lv b{display:block;font-size:15.5px;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live .lv i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
  .live button{flex:none;padding:9px 14px;border-radius:10px;border:2px solid var(--line);
    background:var(--card);color:var(--red);font:800 14px inherit;cursor:pointer}
  .live button:active{background:#FFE9E4}

  .warn{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;
    background:#FFD8D2;border:2px solid var(--line);color:#7E1E18;font-size:14.5px;font-weight:700}
  .warn.show{display:block;animation:pop .34s var(--e)}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  .send{width:100%;margin-top:18px;padding:16px;border:2px solid var(--line);
    border-radius:15px 13px 16px 12px;
    background:var(--yellow);color:var(--ink);font:900 18px inherit;letter-spacing:.02em;
    box-shadow:3px 3px 0 rgba(58,42,30,.2);
    cursor:pointer;transition:transform .16s var(--e),background .22s var(--e)}
  .send:active{transform:translateY(2px);box-shadow:1px 1px 0 rgba(58,42,30,.2)}
  .send.danger{background:var(--red);color:#FFF8E7}
  .send[disabled]{opacity:.42}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:12px 20px;border-radius:13px;font-size:15px;font-weight:700;
    background:var(--ink);color:#FFF8E7;border:2px solid var(--ink);
    transition:all .34s var(--e);max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--red)}

  .hist{margin-top:26px}
  .hist h2{font-size:12px;color:var(--ink3);letter-spacing:.06em;font-weight:500;margin:0 0 10px}
  .item{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
  .item:first-of-type{border-top:0}
  .item .t{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:0 0 44px;padding-top:2px}
  .item .x{flex:1;color:var(--ink2);word-break:break-all}
  .item .x.urgent{color:#B02A22;font-weight:500}
  .item .x.self{color:var(--ink3);font-style:italic}
  .empty{color:var(--ink3);font-size:14px;padding:8px 0}
</style>
</head>
<body>

<header>
  <div class="cls" id="cls"></div>
  <div class="net"><span class="dot"></span><b id="host">连接中</b></div>
</header>

<div class="pwa" id="pwa">
  <button id="pwaInstall">安装到主屏幕</button>
  <i id="pwaIos" hidden>iPhone：分享 → 添加到主屏幕</i>
</div>

<div class="live" id="live">
  <div class="lv">
    <b id="liveText"></b>
    <i id="liveMeta"></i>
  </div>
  <button id="retract">撤回</button>
</div>

<div class="card">
  <textarea id="text" maxlength="60" placeholder="写一句话，教室里马上会看到"></textarea>
  <div class="count"><span id="n">0</span>/60</div>

  <div class="label">显示方式</div>
  <div class="row">
    <button class="seg on" data-level="normal">普通提示</button>
    <button class="seg" data-level="urgent">紧急</button>
  </div>

  <div class="label">显示多久</div>
  <div class="row wrap">
    <button class="seg" data-min="10">10 分钟</button>
    <button class="seg on" data-min="30">30 分钟</button>
    <button class="seg" data-min="60">1 小时</button>
    <button class="seg" data-min="0">直到我关</button>
  </div>
  <div class="custom">
    <span>或</span>
    <input id="mins" type="number" inputmode="numeric" min="1" max="180" placeholder="自定">
    <span>分钟后消失</span>
  </div>

  <div class="warn" id="warn">紧急消息会让整块屏变红。确认要发这一条吗？</div>

  <button class="send" id="send">发到教室</button>
</div>

<div class="hist">
  <h2>最近发出</h2>
  <div id="list"><div class="empty">还没有发过</div></div>
</div>

<div class="card" id="cfgCard">
  <div class="label">改教室设置</div>
  <div class="cfgHint">读取大屏当前的班名、作息和课表，改完发回去，屏上几十秒内生效。
  名册等学生信息不会离开大屏，手机上看不到也改不了。</div>
  <button class="cfgbtn" id="cfgLoad">读取教室当前设置</button>

  <div id="cfgEditor" hidden>
    <div class="label">班名</div>
    <input class="cfgText" id="cfgKlass" type="text" maxlength="20">

    <div class="label">作息时间</div>
    <div id="cfgBlocks"></div>
    <button class="cfgbtn cfgMini" id="cfgBlockAdd">＋ 在最后加一段</button>
    <div class="cfgHint">删某一段会把它的时长并给前一段，保持全天首尾相接；
    删「第 N 节」会同时清掉课表里那一节，后面的节次自动往前排。</div>

    <div class="label">课表（科目 / 任课老师）</div>
    <div id="cfgTable"></div>
    <button class="cfgbtn cfgMini" id="cfgPeriodAdd">＋ 在最后加一节</button>

    <div class="label">提醒文字</div>
    <div id="cfgTexts"></div>

    <div class="label">常用话术</div>
    <div id="cfgPhrases"></div>
    <button class="cfgbtn cfgMini" id="cfgPhraseAdd">＋ 添加一条话术</button>

    <button class="send" id="cfgSave">改完，发到大屏</button>
  </div>

  <div class="cfgHint">改更大规模的（换课程包、名册修正、调中间的时段），还是在大屏上最稳妥；
  或者把导出的设置文件发过去：</div>
  <input id="cfgFile" type="file" accept=".json,application/json" hidden>
  <button class="cfgbtn" id="cfgSend">选择设置文件发送</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var API = location.origin;
  var el = {
    cls: document.getElementById("cls"),
    host: document.getElementById("host"),
    text: document.getElementById("text"),
    n: document.getElementById("n"),
    warn: document.getElementById("warn"),
    send: document.getElementById("send"),
    list: document.getElementById("list"),
    toast: document.getElementById("toast"),
    live: document.getElementById("live"),
    liveText: document.getElementById("liveText"),
    liveMeta: document.getElementById("liveMeta"),
    retract: document.getElementById("retract"),
    mins: document.getElementById("mins"),
    pwa: document.getElementById("pwa"),
    pwaInstall: document.getElementById("pwaInstall"),
    pwaIos: document.getElementById("pwaIos"),
    cfgFile: document.getElementById("cfgFile"),
    cfgSend: document.getElementById("cfgSend"),
    cfgLoad: document.getElementById("cfgLoad"),
    cfgEditor: document.getElementById("cfgEditor"),
    cfgKlass: document.getElementById("cfgKlass"),
    cfgBlocks: document.getElementById("cfgBlocks"),
    cfgTable: document.getElementById("cfgTable"),
    cfgSave: document.getElementById("cfgSave"),
    cfgTexts: document.getElementById("cfgTexts"),
    cfgPhrases: document.getElementById("cfgPhrases"),
    cfgPhraseAdd: document.getElementById("cfgPhraseAdd"),
    cfgBlockAdd: document.getElementById("cfgBlockAdd"),
    cfgPeriodAdd: document.getElementById("cfgPeriodAdd")
  };

  var level = "normal";
  var minutes = 30;
  var armed = false;      // 紧急二次确认
  var busy = false;

  /* ---------- 连接信息 ---------- */

  el.host.textContent = location.host;

  /* ---------- 安装到主屏幕（PWA，ROADMAP 9.4 P2 B1） ----------
     Chromium 系（安卓/鸿蒙）会给 beforeinstallprompt，一键安装；
     iPhone 没有这个事件，只能给指引：分享 → 添加到主屏幕。
     已经装成独立窗口的（display-mode: standalone）不再提示。 */
  (function () {
    if (window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone) return;
    var deferred = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferred = e;
      el.pwa.classList.add("show");
    });
    el.pwaInstall.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () {
        deferred = null;
        el.pwa.classList.remove("show");
      });
    });
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)
        && !window.MSStream) {
      el.pwaIos.hidden = false;
      el.pwa.classList.add("show");
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/phone-sw.js", { scope: "/phone" })
        .catch(function () { });   // 注册不上就当普通页面用，不报错
    }
  })();

  /* ---------- 容器「复活」兜底（2026-11-17 钉钉真机发现） ----------
     钉钉把页面留在容器里，第二次点进来有时只剩一块白屏。
     bfcache 恢复（pageshow.persisted）直接整页刷新；
     从后台回到前台时探一次活，探不通也整页刷新。
     页面本来 15 秒轮询，刷新代价可接受。 */
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) location.reload();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (!document.body || document.body.childElementCount === 0) {
      location.reload();
      return;
    }
    fetch(API + "/api/ping", { cache: "no-store" }).catch(function () {
      location.reload();
    });
  });

  fetch(API + "/api/ping", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) {
        el.cls.textContent = d["class"] || el.cls.textContent;
        document.title = "发到教室 · " + el.cls.textContent;
      }
    })
    .catch(function () {
      el.host.textContent = "没连上教室";
      document.querySelector(".dot").style.background = "#D93B3B";
    });

  /* ---------- 控件 ---------- */

  function pick(selector, attr, val) {
    Array.prototype.forEach.call(document.querySelectorAll(selector), function (b) {
      b.classList.toggle("on", b.getAttribute(attr) === String(val));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-level]"), function (b) {
    b.addEventListener("click", function () {
      level = b.getAttribute("data-level");
      pick("[data-level]", "data-level", level);
      if (level === "urgent") {
        armed = true;
        el.warn.classList.add("show");
        el.send.classList.add("danger");
        el.send.textContent = "确认发送 · 屏会变红";
      } else {
        resetArm();
      }
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-min]"), function (b) {
    b.addEventListener("click", function () {
      minutes = +b.getAttribute("data-min");
      pick("[data-min]", "data-min", minutes);
      el.mins.value = "";
    });
  });

  /* 自定义分钟数：一输入就接管，和上面四个按钮互斥 */
  el.mins.addEventListener("input", function () {
    var v = parseInt(el.mins.value, 10);
    if (el.mins.value === "") {
      minutes = 30;
      pick("[data-min]", "data-min", 30);
      return;
    }
    if (v >= 1 && v <= 180) {
      minutes = v;
      Array.prototype.forEach.call(document.querySelectorAll("[data-min]"), function (b) {
        b.classList.remove("on");
      });
    }
  });

  function resetArm() {
    armed = false;
    el.warn.classList.remove("show");
    el.send.classList.remove("danger");
    el.send.textContent = "发到教室";
  }

  el.text.addEventListener("input", function () {
    el.n.textContent = el.text.value.length;
    if (el.text.value.trim() === "") resetArm();
  });

  /* ---------- 发送 ---------- */

  function toast(msg, bad) {
    el.toast.textContent = msg;
    el.toast.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.className = "toast"; }, 2600);
  }

  el.send.addEventListener("click", function () {
    if (busy) return;
    var text = el.text.value.trim();
    if (!text) { toast("还没写内容", true); el.text.focus(); return; }
    if (level === "urgent" && armed) {
      // 第一次点是确认，第二次才真发
      armed = false;
      el.send.textContent = "正在发送…";
    }

    busy = true;
    el.send.disabled = true;

    fetch(API + "/api/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, level: level, minutes: minutes, forWhom: "class" })
    })
      .then(function (r) { return r.json().then(function (d) { return { code: r.status, d: d }; }); })
      .then(function (res) {
        if (res.code !== 200 || !res.d.ok) {
          throw new Error((res.d && res.d.error) || "发送失败");
        }
        toast("已送到教室");
        el.text.value = "";
        el.n.textContent = "0";
        resetArm();
        load();
      })
      .catch(function (e) {
        var msg = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
          ? "没连上教室，检查手机是否连了学校 WiFi"
          : e.message;
        toast(msg, true);
        resetArm();
      })
      .then(function () {
        busy = false;
        setTimeout(function () { el.send.disabled = false; }, 900);
      });
  });

  /* ---------- 改教室设置（ROADMAP 9.4 P2 B2） ----------
     手机上选一份设置文件（大屏导出的 .json）POST 给服务；
     大屏轮询取到后经整份原子校验应用。文件不合规矩
     服务就当场拒绝，不会把屏弄坏。*/
  el.cfgSend.addEventListener("click", function () { el.cfgFile.click(); });
  el.cfgFile.addEventListener("change", function () {
    var f = el.cfgFile.files && el.cfgFile.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(reader.result)); } catch (e) {}
      if (!obj || obj.format !== "rhythm-config/v1") {
        toast("这不是节律屏导出的设置文件", true);
        return;
      }
      el.cfgSend.disabled = true;
      fetch(API + "/api/config/remote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(obj)
      })
        .then(function (r) { return r.json().then(function (d) { return { code: r.status, d: d }; }); })
        .then(function (res) {
          if (res.code === 200 && res.d.ok) {
            toast("已送到教室大屏，几十秒内生效");
          } else {
            toast((res.d && res.d.error) || "没送到，再试一次", true);
          }
        })
        .catch(function () {
          toast("没连上教室，检查手机是否连了学校 WiFi", true);
        })
        .then(function () {
          el.cfgSend.disabled = false;
          el.cfgFile.value = "";
        });
    };
    reader.readAsText(f);
  });

  /* ---------- 改教室设置（ROADMAP 9.4 P2 B3） ----------
     手机端只拿得到白名单字段（班名/作息/课表/话术），名册
     从不离开大屏；送回去的也只是改过的字段（补丁），名册合并
     由大屏自己完成——手机永远不碰学生信息。 */
  var cfgState = null;
  var WD = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

  function periodLabel(no) {
    var blocks = ((cfgState.config || {}).timetable || {}).blocks || [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type === "class" && blocks[i].periodNo === no) {
        return "第 " + no + " 节 · " + blocks[i].start + "–" + blocks[i].end;
      }
    }
    return "第 " + no + " 节";
  }

  /* ---------- 手机端增删时段 / 课表加删节次（ROADMAP 9.4 P2 后续项） ----------
     删除任意时段：它的时长并入前一段（首段则并入后一段），保持全天首尾相接，
     否则整表会被大屏的原子校验整份拒收；class 块删掉后节次按开始时间
     自动重排，课表条目跟着换号。加时段 / 加节次：只在一天最后追加，
     起点接着上一段结尾，不制造断档。引擎认 type 不认 seq，seq 一律不动。 */
  function addMin(hm, n) {
    var p = String(hm || "08:00").split(":");
    var t = Math.max(0, Math.min(23 * 60 + 59, (+p[0]) * 60 + (+p[1]) + n));
    return ("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + (t % 60)).slice(-2);
  }

  function renumber() {
    var classes = (cfgState.config.timetable.blocks || [])
      .filter(function (b) { return b.type === "class"; })
      .sort(function (x, y) {
        return String(x.start || "").localeCompare(String(y.start || ""));
      });
    var map = {};
    classes.forEach(function (b, i) {
      if (b.periodNo != null) map[b.periodNo] = i + 1;
      b.periodNo = i + 1;
    });
    (cfgState.config.schedule.entries || []).forEach(function (en) {
      if (map[en.periodNo] != null) en.periodNo = map[en.periodNo];
    });
  }

  function dropBlockAt(i) {
    var blocks = cfgState.config.timetable.blocks;
    var b = blocks[i];
    if (!b) return;
    if (i > 0) blocks[i - 1].end = b.end;
    else if (blocks.length > 1) blocks[1].start = b.start;
    blocks.splice(i, 1);
    renumber();
    renderBlocks();
    renderTable();
  }

  function appendBlock(type) {
    var blocks = cfgState.config.timetable.blocks || [];
    if (!blocks.length) return;
    var last = blocks[blocks.length - 1];
    var start = last.end || last.start || "08:00";
    var dur = 10;
    if (type === "class") {
      var lastClass = null;
      blocks.forEach(function (b) { if (b.type === "class") lastClass = b; });
      if (lastClass) {
        var m = String(lastClass.start || "08:00").split(":");
        var n = String(lastClass.end || "08:40").split(":");
        dur = Math.max(20, (+n[0]) * 60 + (+n[1]) - ((+m[0]) * 60 + (+m[1])));
      }
    }
    var b = { start: start, end: addMin(start, dur), type: type };
    if (type === "class") {
      var no = 0;
      blocks.forEach(function (x) {
        if (x.type === "class" && +x.periodNo > no) no = +x.periodNo;
      });
      b.periodNo = no + 1;
    } else {
      b.name = "课间";
    }
    blocks.push(b);
    renumber();
    renderBlocks();
    renderTable();
  }

  function removePeriod(no) {
    var blocks = cfgState.config.timetable.blocks || [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type === "class" && +blocks[i].periodNo === +no) {
        dropBlockAt(i);
        return;
      }
    }
  }

  function renderBlocks() {
    el.cfgBlocks.textContent = "";
    var blocks = cfgState.config.timetable.blocks;
    blocks.forEach(function (b, i) {
      var row = document.createElement("div");
      row.className = "blk";
      var nm = document.createElement("div");
      nm.className = "bn";
      if (b.type === "class") {
        var cap = document.createElement("b");
        cap.textContent = "第 " + b.periodNo + " 节";
        nm.appendChild(cap);
      } else {
        var inp = document.createElement("input");
        inp.value = b.name || "";
        inp.setAttribute("aria-label", "时段名");
        inp.addEventListener("input", function () { b.name = inp.value; });
        nm.appendChild(inp);
      }
      var tm = document.createElement("time");
      var s = document.createElement("input");
      var e = document.createElement("input");
      s.type = e.type = "time";
      s.value = b.start || "";
      e.value = b.end || "";
      s.addEventListener("input", function () { b.start = s.value; });
      e.addEventListener("input", function () { b.end = e.value; });
      tm.appendChild(s);
      tm.appendChild(e);
      row.appendChild(nm);
      row.appendChild(tm);
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "删";
      del.setAttribute("aria-label", "删除这一段");
      del.addEventListener("click", function () { dropBlockAt(i); });
      row.appendChild(del);
      el.cfgBlocks.appendChild(row);
    });
  }

  function renderTable() {
    el.cfgTable.textContent = "";
    var blocks = cfgState.config.timetable.blocks || [];
    var entries = cfgState.config.schedule.entries || [];
    var nos = [];
    blocks.forEach(function (b) {
      if (b.type === "class" && nos.indexOf(+b.periodNo) < 0) nos.push(+b.periodNo);
    });
    entries.forEach(function (en) {
      if (nos.indexOf(+en.periodNo) < 0) nos.push(+en.periodNo);
    });
    nos.sort(function (a, b) { return a - b; });
    nos.forEach(function (no) {
      var box = document.createElement("div");
      box.className = "per";
      var h = document.createElement("h4");
      var cap = document.createElement("span");
      cap.textContent = periodLabel(no);
      h.appendChild(cap);
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "删节次";
      del.setAttribute("aria-label", "删除第 " + no + " 节");
      del.addEventListener("click", function () { removePeriod(no); });
      h.appendChild(del);
      box.appendChild(h);
      var days = [1, 2, 3, 4, 5];
      entries.forEach(function (en) {
        if (+en.periodNo === no && days.indexOf(+en.weekday) < 0) days.push(+en.weekday);
      });
      days.sort(function (a, b) { return a - b; });
      days.forEach(function (wd) {
        var en = null;
        entries.forEach(function (x) {
          if (+x.periodNo === no && +x.weekday === wd) en = x;
        });
        var row = document.createElement("div");
        row.className = "day";
        var d = document.createElement("b");
        d.textContent = WD[wd - 1] || "周" + wd;
        var sub = document.createElement("input");
        var tea = document.createElement("input");
        tea.placeholder = "老师";
        sub.value = en ? (en.subject || "") : "";
        tea.value = en ? (en.teacher || "") : "";
        sub.addEventListener("input", function () {
          if (!en) {
            en = { weekday: wd, periodNo: no, subject: "", teacher: "" };
            entries.push(en);
          }
          en.subject = sub.value;
        });
        tea.addEventListener("input", function () {
          if (!en) {
            en = { weekday: wd, periodNo: no, subject: "", teacher: "" };
            entries.push(en);
          }
          en.teacher = tea.value;
        });
        row.appendChild(d);
        row.appendChild(sub);
        row.appendChild(tea);
        box.appendChild(row);
      });
      el.cfgTable.appendChild(box);
    });
  }

  /* 提醒文字：texts 是嵌套对象，递归摊平成「路径标签 + 输入框」，
     改哪个字段就写回哪个字段；结构上没有名册，可以放心展示。 */
  function renderTexts(obj, path, box) {
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      if (v && typeof v === "object") {
        renderTexts(v, path ? path + " · " + k : k, box);
        return;
      }
      var row = document.createElement("div");
      row.className = "txtRow";
      var b = document.createElement("b");
      b.textContent = path ? path + " · " + k : k;
      var inp = document.createElement("input");
      inp.value = String(v == null ? "" : v);
      inp.addEventListener("input", function () { obj[k] = inp.value; });
      row.appendChild(b);
      row.appendChild(inp);
      box.appendChild(row);
    });
  }

  function renderPhrases() {
    el.cfgPhrases.textContent = "";
    (cfgState.phrases || []).forEach(function (ph, i) {
      var row = document.createElement("div");
      row.className = "phRow";
      var inp = document.createElement("input");
      inp.value = ph;
      inp.addEventListener("input", function () { cfgState.phrases[i] = inp.value; });
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "删";
      del.addEventListener("click", function () {
        cfgState.phrases.splice(i, 1);
        renderPhrases();
      });
      row.appendChild(inp);
      row.appendChild(del);
      el.cfgPhrases.appendChild(row);
    });
  }

  el.cfgPhraseAdd.addEventListener("click", function () {
    if (!cfgState) return;
    if (!Array.isArray(cfgState.phrases)) cfgState.phrases = [];
    cfgState.phrases.push("");
    renderPhrases();
    var rows = el.cfgPhrases.querySelectorAll("input");
    if (rows.length) rows[rows.length - 1].focus();
  });

  el.cfgBlockAdd.addEventListener("click", function () {
    if (!cfgState) return;
    appendBlock("break");
  });

  el.cfgPeriodAdd.addEventListener("click", function () {
    if (!cfgState) return;
    appendBlock("class");
  });

  el.cfgLoad.addEventListener("click", function () {
    el.cfgLoad.disabled = true;
    fetch(API + "/api/config/remote/state", { cache: "no-store" })
      .then(function (r) { return r.json().then(function (d) { return { code: r.status, d: d }; }); })
      .then(function (res) {
        if (res.code !== 200 || !res.d.config) {
          toast((res.d && res.d.error) || "读不到教室设置", true);
          return;
        }
        cfgState = res.d;
        el.cfgKlass.value = (cfgState.config.meta || {}).klass || "";
        renderBlocks();
        renderTable();
        el.cfgTexts.textContent = "";
        renderTexts(cfgState.texts || {}, "", el.cfgTexts);
        renderPhrases();
        el.cfgEditor.hidden = false;
        toast("已读到大屏当前设置");
      })
      .catch(function () {
        toast("没连上教室，检查手机是否连了学校 WiFi", true);
      })
      .then(function () {
        el.cfgLoad.disabled = false;
      });
  });

  el.cfgSave.addEventListener("click", function () {
    if (!cfgState) return;
    var klass = el.cfgKlass.value.trim();
    if (!klass) { toast("班名不能空", true); return; }
    var patch = {
      format: "rhythm-config-patch/v1",
      config: {
        meta: { klass: klass },
        timetable: cfgState.config.timetable,
        schedule: cfgState.config.schedule
      },
      texts: cfgState.texts || {},
      phrases: (cfgState.phrases || []).map(function (s) { return String(s).trim(); })
                                       .filter(function (s) { return s; })
    };
    el.cfgSave.disabled = true;
    fetch(API + "/api/config/remote/patch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch)
    })
      .then(function (r) { return r.json().then(function (d) { return { code: r.status, d: d }; }); })
      .then(function (res) {
        if (res.code === 200 && res.d.ok) {
          toast("已送到教室大屏，几十秒内生效");
        } else {
          toast((res.d && res.d.error) || "没送到，再试一次", true);
        }
      })
      .catch(function () {
        toast("没连上教室，检查手机是否连了学校 WiFi", true);
      })
      .then(function () {
        el.cfgSave.disabled = false;
      });
  });

  /* ---------- 历史 ---------- */

  /* 屏上现在是什么：手机端也要能看见，否则老师不知道要不要撤回 */
  function ended(m, now) {
    if (!m.until) return false;
    if (m.until >= "00:00" && m.until < "06:00") return false;
    return now >= m.until;
  }

  function nowHM() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function renderLive(list) {
    var now = nowHM();
    var cur = null;
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.retractedAt || m.forWhom !== "class" || ended(m, now)) continue;
      cur = m; break;
    }
    if (!cur) { el.live.classList.remove("show"); return; }
    el.liveText.textContent = cur.text;
    el.liveMeta.textContent = cur.until === "23:59"
      ? cur.at + " 发出 · 显示到今天结束"
      : cur.at + " 发出 · " + cur.until + " 自动消失";
    el.live.classList.add("show");
  }

  el.retract.addEventListener("click", function () {
    el.retract.disabled = true;
    fetch(API + "/api/retract", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        toast(d && d.cleared ? "已从教室撤下" : "屏上没有可撤回的消息");
        load();
      })
      .catch(function () { toast("没连上教室，检查 WiFi", true); })
      .then(function () { setTimeout(function () { el.retract.disabled = false; }, 800); });
  });

  function load() {
    fetch(API + "/api/messages?n=8", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var all = (d.messages || []).slice().reverse();
        renderLive(all);
        var list = all.slice(0, 5);
        if (!list.length) {
          el.list.innerHTML = '<div class="empty">还没有发过</div>';
          return;
        }
        el.list.innerHTML = "";
        list.forEach(function (m) {
          var row = document.createElement("div");
          row.className = "item";
          var t = document.createElement("div");
          t.className = "t";
          t.textContent = m.at || "";
          var x = document.createElement("div");
          x.className = "x" + (m.level === "urgent" ? " urgent" : "");
          x.textContent = m.text;
          row.appendChild(t);
          row.appendChild(x);
          el.list.appendChild(row);
        });
      })
      .catch(function () {
        el.list.innerHTML = '<div class="empty">读不到历史</div>';
      });
  }

  load();
  setInterval(load, 15000);
})();
</script>
</body>
