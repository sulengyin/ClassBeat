<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演练</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<!-- 打开就自动播放。参数写在 HTML 里，不依赖地址栏，
     所以预览工具即使吞掉 ?demo=1 也不影响。
     起点选 10:14（课间刚开始）：一打开就是黄色贴纸卡，
     12 秒后进入倒计时，能同时看到主视觉换主角。 -->
<iframe src="index.html?demo=1&t=10:14" title="一日演练" allow="fullscreen"></iframe>
</body>
</html>
