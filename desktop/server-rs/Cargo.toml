[package]
name = "classbeat-server"
version = "0.5.3"
edition = "2021"
rust-version = "1.77"
description = "ClassBeat 班级节律屏 · 局域网服务（Rust 版，取代 rhythm_server.py）"
license = "MIT"

[[bin]]
name = "classbeat-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
