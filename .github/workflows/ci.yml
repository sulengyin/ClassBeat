name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 版本说明（2026-11）：
# · 所有 action 升到 v7，运行时是 node24。之前的 v4/v5 报
#   "Node.js 20 is deprecated"，每次运行都会多一条 warning。
# · runs-on 从 ubuntu-latest 改成 ubuntu-24.04。GitHub 从 2026-10-19 起
#   把 ubuntu-latest 逐步迁到 Ubuntu 26，同一份工作流会在不同镜像上跑；
#   钉住 24.04 才能保证 Playwright 拿到的依赖是可复现的。
# · Node 从 20 升到 24（20 已过 LTS 维护期）。

jobs:
  # 逻辑层：不碰浏览器，几秒钟跑完，失败信息最直接
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 仓库里没有 data/，全部用 sample/ 的化名数据构建
      - name: Build data
        run: python3 tools/bundle.py --data sample

      - name: 节律逻辑
        run: node tools/test_rhythm.js

      - name: 北京时间
        run: node tools/test_clock.js

      - name: 本地存储
        run: node tools/test_store.js

      - name: 页面能起来
        run: node tools/test_dom.js

      # 前端引擎 vs Python 编译器，132 天逐字段对拍（基准在 tools/golden/）
      - name: 引擎对拍
        run: node tools/test_engine.js

      - name: 数据自洽
        run: python3 tools/check_p1.py

      - name: 校历与轮岗
        run: python3 tools/test_calendar.py

      - name: 消息服务
        run: python3 tools/test_server.py

      # 真实班级数据一旦入库就收不回来，这里守住最后一道
      - name: 隐私检查
        run: |
          bad=$(git ls-files | grep -E '^(data|assets|out|dist|preview|backups)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::真实数据目录被提交了：$bad"
            exit 1
          fi
          echo "已跟踪文件里没有 data/、assets/ 等本地目录"

  # 换学校：4 套作息 × 5 套岗位 × 4 份校历，每套连续编译 70 天
  variants:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 跨学校配置矩阵
        run: python3 tools/test_variants.py --verbose

  # 真浏览器：一体机 1920/1366、iPad(Safari 内核)、iPhone/SE/安卓/鸿蒙视口
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Chromium ≈ 安卓/鸿蒙/Windows 一体机，WebKit ≈ iPhone/iPad Safari
      #
      # 浏览器约 300 MB，从 CDN 下载偶尔会卡到十几分钟（2026-11-06 就卡过一次）。
      # 所以缓存 ~/.cache/ms-playwright，并且给下载单独设上限：
      # 挂住时宁可在这一步失败，也不要吃掉整个 job 的 25 分钟。
      - name: 缓存浏览器
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装浏览器系统依赖
        timeout-minutes: 8
        run: npx playwright install-deps chromium webkit

      - name: 安装浏览器
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install chromium webkit

      - name: 生成示例数据
        run: python3 tools/bundle.py --data sample

      - name: 跑浏览器测试
        run: npx playwright test

      # HTML 报告是 artifact，公开仓库下载要登录；这一步把结论打成
      # notice/warning，在 Actions 页面和 check-run API 里都能直接读到
      # 「哪个项目、哪一条、失败还是偶发」。
      - name: 报告摘要
        if: always()
        run: node tools/e2e/summary.js

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          if-no-files-found: warn
          retention-days: 7
