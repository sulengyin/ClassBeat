name: Release

# 手动跑 = 只验证「这份代码能不能打出完整的包」，产物进 artifact；
# 打 tag（v*）= 同上，并把 zip 和单文件版挂到 GitHub Release。
#
# 仓库里没有 data/，一律用 sample/ 的化名班级构建。包名会带「五1班」，
# 老师装上后首次打开自动进配置向导，改成自己的班即可。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai          # 包名里的日期用北京时间，不要跟着 runner 走 UTC

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 免安装运行时约 11 MB，从 python.org 下载。缓存住，
      # 手动验证时不用每次都等这一下。
      - name: 缓存免安装 Python
        uses: actions/cache@v6
        with:
          path: tools/vendor
          key: python-embed-3.12.10

      - name: 用示例班级构建配置
        run: python3 tools/bundle.py --data sample

      - name: 打包（含免安装 Python）
        run: python3 tools/package.py

      # 更新清单只对正式 tag 有意义：下载地址要用 tag 才拼得出来。
      # 生成后会按安装器的同一套规则自校验，坏清单不会流到 Release。
      - name: 生成更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          zip=$(ls dist/*.zip | head -1)
          python3 tools/make_update.py \
            --zip "$zip" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file CHANGELOG.md \
            --min-version 0.2.0
          test -s dist/update.json

      - name: 检查产物
        run: |
          set -e
          ls -lh dist
          zip=$(ls dist/*.zip | head -1)
          unzip -l "$zip" | grep -q "server/python/python.exe"
          unzip -l "$zip" | grep -q "启动手机服务.bat"
          unzip -l "$zip" | grep -q "app/setup.js"
          unzip -l "$zip" | grep -q "MANIFEST.txt"
          # 包里绝不能带真实班级数据或运行期文件
          if unzip -l "$zip" | grep -Eq "/(data/|server/messages\.json|server/server\.log|server/service\.pid)"; then
            echo "包里混进了不该发布的文件："
            unzip -l "$zip" | grep -E "/(data/|server/messages\.json|server/server\.log|server/service\.pid)"
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_ENV"
          if [ -f dist/update.json ]; then
            python3 tools/make_update.py --check-only --dist dist
          fi
          echo "已确认：$zip 自带运行时、手机服务、配置向导、MANIFEST"

      # update.json 提交回仓库 main 分支（2026-11-18 加速域名方案）：
      # 包内更新源 = 加速前缀 + raw.githubusercontent.com/.../main/update.json，
      # 这个 raw 地址永远指向最新版。直连 GitHub 不稳，加速前缀由
      # update-source.txt 配置，程序自动推导；仓库里这份清单本身不用改。
      - name: 更新清单提交回仓库
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          content=$(base64 -w0 dist/update.json)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json?ref=main" \
            --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/update.json" \
              -f message="update.json: $GITHUB_REF_NAME（by release.yml）" \
              -f content="$content" -f branch=main -f sha="$sha" --jq '.commit.sha'
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/update.json" \
              -f message="update.json: $GITHUB_REF_NAME（by release.yml）" \
              -f content="$content" -f branch=main --jq '.commit.sha'
          fi
          echo "update.json 已提交到 main；raw 地址："
          echo "  https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/update.json"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: classbeat-package
          path: |
            dist/*.zip
            dist/*-single.html
          retention-days: 30

      - name: 上传更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: classbeat-update-manifest
          path: dist/update.json
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$zip" dist/*-single.html dist/update.json \
            --title "ClassBeat $GITHUB_REF_NAME" \
            --notes "Windows：下载 classbeat-版本号.zip，解压后双击「打开大屏.bat」；只想看看效果可下载 classbeat-版本号-single.html 双击打开；附件名用纯英文，是因为 GitHub 会把中文附件名净化成「1.-.-」，包内目录仍是中文；完整说明见仓库 CHANGELOG.md。" \
            --generate-notes \
            --verify-tag
