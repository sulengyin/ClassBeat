name: Release

# 手动跑 = 只验证「这份代码能不能打出完整的包」，产物进 artifact；
# 打 tag（v*）= 同上，并把安装包 / 签名 / latest.json / 单文件演示版挂到 GitHub Release。
#
# 0.5.3 起只有一条发布线：Tauri 桌面安装包。
# 老形态（解压即用的 zip + pythonw + PowerShell 看门狗 + 自解压安装器 + 页面内更新器）
# 已退役，连同 `server/*.py`、`tools/package.py`、`tools/build_installer.py`、
# `tools/make_update.py`、`tools/launcher/` 一起删除——那两个 job 也一并去掉。
# 想给不想装软件的机器看效果，用同一次构建出来的单文件版（classbeat-tools single）。
#
# 仓库里没有 data/，一律用 sample/ 的化名班级构建。包名会带「五1班」，
# 老师装上后首次打开自动进配置向导，改成自己的班即可。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai          # 包名里的日期用北京时间，不要跟着 runner 走 UTC

jobs:
  # ------------------------------------------------------------------
  # 桌面版：Tauri 安装包 + 更新清单 + 单文件演示版
  #
  # 为什么必须有 latest.json：桌面版靠 tauri-plugin-updater + latest.json 更新。
  # 少了它，releases/latest/download/latest.json 就是 404，老版本点「检查更新」
  # 永远失败，只能手动下载重装。
  #
  # 需要两个仓库 secret（Settings → Secrets → Actions）：
  #   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥全文（minisign）
  #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令
  # 公钥在 desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey，
  # 一旦换钥匙，所有老版本都验不过签名，务必沿用同一对。
  # ------------------------------------------------------------------
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/server-rs -> target
            desktop/tools-rs -> target

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 检查签名密钥
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY；没有它出不了可更新的安装包。"
            exit 1
          fi
          echo "签名密钥已配置（长度 ${#KEY}）"

      # 服务与构建工具都是 Rust，先编出来：stage 要拷 classbeat-server.exe
      - name: 构建服务与构建工具
        run: |
          cargo build --release --manifest-path desktop/server-rs/Cargo.toml
          cargo build --release --manifest-path desktop/tools-rs/Cargo.toml

      - name: 装配资源（示例班级）
        run: desktop/tools-rs/target/release/classbeat-tools.exe stage --data sample

      # 装配后复核：有几条不变量只有把资源铺好才看得到（版本双轨、资源里无 .py、
      # build-info 与 tauri.conf 一致）。和 build_windows.ps1 的顺序保持一致。
      - name: 装配后自检
        run: desktop/tools-rs/target/release/classbeat-tools.exe verify

      - name: 前端工具链
        working-directory: desktop
        run: npm ci

      - name: 出桌面安装包
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      # latest.json 的形状由 classbeat-tools 保证：它挑 .nsis.zip 优先、
      # 缺 .sig 直接失败，签名原文写进 platforms.windows-x86_64.signature。
      # notes 交给 --notes-file：大屏面板是 textContent 渲染，直接塞
      # `head -30 CHANGELOG.md` 会显示成 "## 0.5.2 — 日期 - 条目 - 条目"，
      # 工具取第一节、去掉 Markdown 记号、按「；」连成一句话再入库。
      - name: 生成更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p desktop/dist/desktop
          # 更新源 = 国内加速域名优先 + GitHub 原地址兜底（教室大屏不允许直连外网）。
          # 清单里的安装包地址必须走加速域名，否则客户端就算从加速域名拿到清单，
          # 下载安装包时仍会去连 GitHub 而失败。0.5.3 曾把这一层弄丢，务必保留。
          # 换加速域名只需改 UPDATE_MIRROR 一行；客户端 endpoints 在更新器里
          # 按 update-source.txt 依次尝试，二者用同一个前缀列表。
          UPDATE_MIRROR="https://ghfast.top/"
          ORIGIN_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          desktop/tools-rs/target/release/classbeat-tools.exe make-latest \
            --bundle desktop/src-tauri/target/release/bundle/nsis \
            --version "$version" \
            --base-url "${UPDATE_MIRROR}${ORIGIN_URL}" \
            --out desktop/dist/desktop/latest.json \
            --notes-file CHANGELOG.md \
            --notes-max 300
          cat desktop/dist/desktop/latest.json

      # 单文件演示版：整个大屏内联成一个 html，双击就开，不用安装。
      # 数据用 sample 的化名班级；版本号取 app/version.js（界面版本），
      # 构建号取当前提交，和安装版显示的是同一套。
      - name: 出单文件演示版
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p desktop/dist/desktop
          desktop/tools-rs/target/release/classbeat-tools.exe single \
            --data sample \
            --out "desktop/dist/desktop/classbeat-$version-single.html"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: classbeat-desktop
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/dist/desktop/latest.json
            desktop/dist/desktop/*-single.html
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            desktop/src-tauri/target/release/bundle/nsis/ClassBeat_"$version"_x64-setup.exe \
            desktop/src-tauri/target/release/bundle/nsis/ClassBeat_"$version"_x64-setup.exe.sig \
            desktop/dist/desktop/latest.json \
            "desktop/dist/desktop/classbeat-$version-single.html" \
            --title "ClassBeat $GITHUB_REF_NAME" \
            --notes "桌面版（推荐）：下载 ClassBeat_${version}_x64-setup.exe 双击安装——不需要管理员密码，装到本机用户目录，班级数据保留，装完自动建桌面图标、打开即全屏。已经在用旧版的不用重新下载，大屏右下角「⋯」→ 更新里点「检查更新」就能升上来（更新器读的是同一次发布的 latest.json）。只想看看效果：下载 classbeat-${version}-single.html 双击打开，不用安装（单文件版没有手机发消息，也不能自更新）。附件名用纯英文，是因为 GitHub 会把中文附件名净化成「1.-.-」，包内目录仍是中文；完整说明见仓库 CHANGELOG.md。" \
            --verify-tag
          echo "更新器入口：https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
