name: Smoke

# 真机前的「能排除的都排除」。CI 的 unit/e2e 全在 Linux 上，有些问题只在
# 多轮重复运行时才露头（2026-11-19 的 ⑰「Windows 上 SO_REUSEADDR 劫持让
# 端口顺延失效」就是「虚拟机全绿、真机才炸」的漏网之鱼）。
#
# 0.5.3 起这里**只留多轮回归**：原来那个 windows-smoke job 是解包老 zip、
# 用包内 python.exe 起 Python 服务、再 DryRun 看门狗与自解压安装器——
# 那些东西连同 `server/*.py`、`tools/launcher/`、`tools/package.py`、
# `tools/smoke_windows.py` 一起退役了，已经没有可解包的包。
# 桌面版的 Windows 侧把关改由 release.yml 的 desktop job 承担：
#   装配 → verify（文件/模块/配置/钩子/装配不变量）→ tauri build → make-latest；
# 真机上的安装、更新、误关与自愈由 `classbeat-tools accept` 在教室里跑（17 项）。
#
# 触发：main 更新 + 手动（Actions 页面 Run workflow）。普通 PR 不跑，
# 避免把 CI 的等待时间再拉长一截。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  # Linux 多轮回归：同一套套件连跑几轮，抓偶发
  regress-rounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 缓存浏览器
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # apt 源时段性抽风（2026-11-18 晚持续 1 小时+）：最多试 3 次
      - name: 安装浏览器系统依赖
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试 ====="
            npx playwright install-deps chromium webkit && exit 0
            echo "第 $i 次失败（apt 源抖动？），等 2 分钟再试"
            sleep 120
          done
          echo "::error::浏览器系统依赖 3 次都没装上，apt 源持续不可用"
          exit 1

      - name: 安装浏览器
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: npx playwright install chromium webkit

      - name: 生成示例数据
        run: python3 tools/bundle.py --data sample

      # 被测服务是 Rust 的 classbeat-server（0.5.3 起 Python 版已退役），
      # playwright.config.js 会直接拉起这个二进制，所以先编出来。
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/server-rs -> target

      - name: 编被测服务
        run: cargo build --release --manifest-path desktop/server-rs/Cargo.toml


      # 逻辑层连跑 3 轮：这类套件单轮很难暴露时序问题，跑三轮才有点意义
      - name: 逻辑层回归 ×3
        run: |
          for i in 1 2 3; do
            echo "===== 第 $i 轮 ====="
            node tools/test_rhythm.js   || exit 1
            node tools/test_clock.js    || exit 1
            node tools/test_store.js    || exit 1
            node tools/test_dom.js      || exit 1
            node tools/test_remote.js   || exit 1
            node tools/test_setup.js    || exit 1
            node tools/test_engine.js   || exit 1
            node tools/test_backup.js   || exit 1
          done

      # 真浏览器 e2e 连跑 2 轮
      - name: e2e ×2
        timeout-minutes: 30
        run: |
          for i in 1 2; do
            echo "===== e2e 第 $i 轮 ====="
            npx playwright test || exit 1
          done

      - name: 报告摘要
        if: always()
        run: node tools/e2e/summary.js

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          if-no-files-found: warn
          retention-days: 7
